name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: python3 tools/gen_xcodeproj.py

      - name: Build (Release / iphoneos / unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DocScan.xcodeproj \
            -scheme DocScan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Pack unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DocScan.app build/ipa/Payload/
          cd build/ipa && zip -qry ../DocScan-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-unsigned-ipa
          path: build/DocScan-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to repo via API
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: python3 tools/publish_ipa.py

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30
